services:
  localstack:
    image: localstack/localstack:4.4
    container_name: localstack_dev
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb
      - PERSISTENCE=1
    volumes:
      - localstack_data:/var/lib/localstack

  rag_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_service_dev
    working_dir: /app
    command: >
      sh -c "uv run uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app"
    env_file:
      - .env
    environment:
      - DYNAMODB_ENDPOINT_URL=http://localstack:4566
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
    depends_on:
      - localstack

volumes:
  localstack_data:
