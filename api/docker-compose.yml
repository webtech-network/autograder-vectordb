services:
  rag_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag_service_dev
    working_dir: /app
    command: >
      sh -c "uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app/app"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./requirements.txt:/app/requirements.txt:ro
